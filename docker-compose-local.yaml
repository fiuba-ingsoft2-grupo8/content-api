name: melodia-user-api

services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin_password
      MONGO_INITDB_DATABASE: userdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - melodia-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 30s
  
  content-api:
    image: content-api:latest
    container_name: content-api
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATABASE_URL: "mongodb://admin:admin_password@mongodb:27017/userdb?authSource=admin"
      SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhbHduc29paGhwcnFlcHBlbG9pIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2MDI2NTQzMiwiZXhwIjoyMDc1ODQxNDMyfQ.PHEfsfx09gKWT2qV79Zh270zm7Szo-fI-ys7C2BOo8M
      SUPABASE_BUCKET: images
      SUPABASE_URL: https://qalwnsoihhprqeppeloi.supabase.co
    ports:
      - "8080:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - melodia-network
      
volumes:
  mongodb_data:

networks:
  melodia-network:
    driver: bridge