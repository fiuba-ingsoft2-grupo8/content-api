name: Deploy on EC2

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build docker image
        run: docker build -t jandresen99/fiuba-melodia .
      - name: Push image to docker hub
        run: docker push jandresen99/fiuba-melodia:latest
  deploy:
    needs: build
    runs-on: [self-hosted, user-api]
    steps:
      - name: Pull docker image
        run: docker pull jandresen99/fiuba-melodia:latest
      - name: Delete old container
        run: docker rm -f user-api  
      - name: Run docker container
        run: |
          docker run -d -p 8080:8080 --name user-api \
            -e DATABASE_HOST=${{ secrets.DATABASE_HOST }} \
            -e DATABASE_APPNAME=${{ secrets.DATABASE_APPNAME }} \
            -e DATABASE_USER=${{ secrets.DATABASE_USER }} \
            -e DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            -e DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }} \
            -e DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} \
            jandresen99/fiuba-melodia:latest