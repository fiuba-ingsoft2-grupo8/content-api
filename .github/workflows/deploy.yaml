name: Deploy on EC2

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build docker image
        run: docker build -t jandresen99/content-api .
      - name: Push image to docker hub
        run: docker push jandresen99/content-api:latest
  deploy:
    needs: build
    runs-on: [self-hosted, content-api]
    steps:
      - name: Delete old container
        run: sudo docker rm -f content-api
      - name: Cleanup docker
        run: sudo docker system prune -af --volumes
      - name: Pull docker image
        run: sudo docker pull jandresen99/content-api:latest
      - name: Run docker container
        run: |
          sudo docker run -d -p 8080:8080 --name content-api \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -e SUPABASE_SERVICE_KEY="${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -e SUPABASE_BUCKET="${{ secrets.SUPABASE_BUCKET }}" \
            -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            jandresen99/content-api:latest