name: Deploy on EC2

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build docker image
        run: docker build -t jandresen99/content-api .
      - name: Push image to docker hub
        run: docker push jandresen99/content-api:latest
  deploy:
    needs: build
    runs-on: [self-hosted, user-api]
    steps:
      - name: Pull docker image
        run: docker pull jandresen99/content-api:latest
      - name: Delete old container
        run: docker rm -f content-api
      - name: Run docker container
        run: |
          docker run -d -p 8080:8080 --name content-api \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            jandresen99/content-api:latest